name: CI

on:
  pull_request:
    branches:
      - master
  # Allow running the (pricier) macOS iOS build on demand from the Actions tab
  # without opening a PR.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create secrets.dart from example (CI placeholder)
        run: |
          if [ ! -f lib/secrets.dart ]; then
            cp lib/secrets.dart.example lib/secrets.dart
          fi

      - run: flutter pub get
      # Catches lint warnings + type errors that the test runner doesn't surface.
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

      # Android is the shipping target, but CI only ever built web — so a
      # Gradle/AGP configuration error, the kind that fails at configuration
      # time and therefore breaks EVERY variant and every task, could reach
      # master with all checks green. Debug build because it needs no signing
      # (android/key.properties is gitignored); google-services.json is
      # committed, so nothing else is required. One flavour is enough: a
      # configuration-time break takes them all down together.
      - run: flutter build apk --debug --flavor phone -t lib/main.dart

      # The Android Auto surface is Kotlin in the `auto` flavour with no Dart
      # tests at all — the native-edge blind spot where client/server contract
      # bugs have historically clustered. These JVM unit tests are the only
      # automated coverage it has, and until now they ran only if someone
      # remembered to invoke Gradle by hand.
      - name: Android Auto unit tests
        working-directory: android
        run: ./gradlew :app:testAutoDebugUnitTest --console=plain

  # Compiles the iOS app on a macOS runner. Proves the whole iOS toolchain is
  # healthy — CocoaPods resolves the Firebase 12.x pods against the iOS 15
  # deployment target, and Dart compiles/links to a native Runner.app — WITHOUT
  # needing a paid Apple Developer account or signing certificates. This is the
  # only way to build for iOS without a Mac of your own.
  #
  # macOS runners bill at 10x the Linux rate, so this is manual-only: trigger it
  # from the Actions tab ("Run workflow") when the iOS side has changed.
  build-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create secrets.dart from example (CI placeholder)
        run: |
          if [ ! -f lib/secrets.dart ]; then
            cp lib/secrets.dart.example lib/secrets.dart
          fi

      - run: flutter pub get

      # Runs `pod install` then compiles & links an unsigned release Runner.app.
      # --no-codesign skips the parts that would require certificates/profiles.
      - run: flutter build ios --release --no-codesign

      # ----------------------------------------------------------------------
      # NEXT STEP — ship to a physical device / TestFlight (needs a paid Apple
      # Developer account, $99/yr). Replace the step above with a signed archive
      # and upload. Sketch of the extra steps:
      #
      #   - name: Import signing certificate
      #     uses: apple-actions/import-codesign-certs@v3
      #     with:
      #       p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
      #       p12-password:    ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      #   - name: Install provisioning profile
