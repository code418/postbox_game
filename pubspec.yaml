name: postbox_game
description: Find postboxes for megapoints

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.4.0+19

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  cloud_functions: ^6.1.0
  firebase_core: ^4.6.0  # 3.13+ native code uses new Pigeon channel prefix but pubspec still pins platform_interface ^5.x — mismatch breaks initializeApp
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.5.6
  geolocator: ^14.0.2
  google_sign_in: ^7.2.0
  flutter_compass: ^0.8.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  meta: ^1.8.0
  font_awesome_flutter: ^11.0.0
  animated_text_kit: ^4.2.2
  shared_preferences: ^2.2.2
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  firebase_analytics: ^12.2.0
  firebase_app_check: ^0.4.2
  confetti: ^0.8.0
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  intl: ^0.20.2
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  home_widget: ^0.9.1
  firebase_storage: ^13.0.0
  image_picker: ^1.1.0
  exif: ^3.3.0
  url_launcher: ^6.3.0
  share_plus: ^13.1.0
  http: ^1.2.0
  firebase_remote_config: ^6.4.0
  # Custom code traces only (PerfService.traceAsync). We deliberately do NOT add
  # the com.google.firebase.firebase-perf Gradle plugin — perf-plugin:1.4.2 is
  # incompatible with AGP 8.x; the plugin is only needed for automatic network/
  # screen-render traces, which we don't use. See android/app/build.gradle.
  firebase_performance: ^0.11.4+2
  # Crashlytics. The native side re-adds the com.google.firebase.crashlytics
  # Gradle plugin (AGP-8-compatible, unlike firebase-perf) for release mapping-
  # file upload — see android/build.gradle + android/app/build.gradle.
  firebase_crashlytics: ^5.2.3
  # Direct dep so settings_screen can read the running build's version at
  # runtime (was previously hardcoded to '1.0.0'). Stays in lockstep with the
  # `^10.1.0` override below — both must move together if the desktop-only
  # transitive constraint is ever relaxed and the override can be dropped.
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: ^8.0.0
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0

# win32 and package_info_plus are pulled in ONLY by geolocator_linux /
# geolocator_windows — endorsed desktop platform packages that pub resolves
# transitively even though this app ships Android/iOS/web only (see the
# deleted linux/windows/macos outputs). geolocator_linux pins
# package_info_plus ^9.0.0 -> win32 ^5.5.3, which capped win32 below 6.0 and
# thereby blocked share_plus 13 and package_info_plus 10. None of this code is
# compiled into the mobile builds, so we override the caps. Drop these once
# geolocator relaxes its desktop constraints upstream.
dependency_overrides:
  win32: ^6.0.1
  package_info_plus: ^10.1.0


# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  default-flavor: phone
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/postman_james.svg
    - assets/postman_james.png
    - assets/postbox.svg
    - assets/uk_counties_simplified.geojson
    - assets/legal/privacy_policy.md

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.io/custom-fonts/#from-packages
