plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    // Explicit KGP retained (NOT Flutter Built-in Kotlin): Flutter 3.44's built-in
    // Kotlin is 2.0.0, too old to read our deps' 2.2.0 metadata. See settings.gradle.
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader ->
        keyProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.code418.postbox_game"
    compileSdk 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.code418.postbox_game"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
            // Submitted to Google Play. Carries NO Android Auto surface (Play
            // rejected the car app twice under the Auto app-quality guidelines).
        }
        auto {
            dimension "device"
            // Same app as `phone` (shared applicationId -> reuses Firebase /
            // Google Sign-In / App Check config) PLUS the full Android Auto
            // surface. Distributed OUTSIDE Google Play, so it needs no separate
            // versionCode band; the suffix just makes the build identifiable.
            versionNameSuffix "-auto"
        }
        wear {
            dimension "device"
            minSdk 30 // Wear OS 3+ requires API 30
            // Sit in a separate versionCode band so Play accepts both AABs
            // for the same applicationId in one release.
            versionCode flutterVersionCode.toInteger() + 10000
            versionNameSuffix "-wear"
        }
    }

    signingConfigs {
        release {
            keyAlias keyProperties['keyAlias']
            keyPassword keyProperties['keyPassword']
            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword keyProperties['storePassword']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    testOptions {
        // The car HomeCarTemplate unit test builds Car App Library model objects
        // on the JVM; let any incidental android.* stub call return defaults
        // rather than throwing "Method ... not mocked".
        unitTests.returnDefaultValues = true
    }
}

flutter {
    source '../..'
}

// home_widget 0.9.1 declares 'androidx.glance:glance-appwidget:1.+', which now
// resolves to 1.3.0-alpha01 — that alpha requires compileSdk 37 + AGP 9.1.0
// (we're on 36 + 8.11.1). Pin to the latest 1.1.x stable so the build keeps
// working until home_widget tightens its constraint or we move to AGP 9.
configurations.all {
    resolutionStrategy {
        force 'androidx.glance:glance-appwidget:1.1.1'
        force 'androidx.glance:glance:1.1.1'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "androidx.multidex:multidex:2.0.1"
    // Android Auto surface. Uses the Car App Library templated UI — no Flutter
    // runtime is loaded in the car; the car screen talks to Firebase Functions /
    // Firestore directly. Scoped to the `auto` flavour ONLY, so neither the
    // Play-bound `phone` AAB nor the `wear` AAB links these libraries.
    autoImplementation 'androidx.car.app:app:1.7.0'
    autoImplementation 'androidx.car.app:app-projected:1.7.0'
    autoImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    autoImplementation platform('com.google.firebase:firebase-bom:33.7.0')
    autoImplementation 'com.google.firebase:firebase-auth'
    autoImplementation 'com.google.firebase:firebase-functions'
    autoImplementation 'com.google.firebase:firebase-firestore'
    // Read-only: ClaimAction checks the maintenance_mode flag before claiming.
    // startScoring has no server-side maintenance check, so the client is the
    // only gate — and the car runtime never loads the Dart engine, so it can't
    // reach RemoteConfigService.
    autoImplementation 'com.google.firebase:firebase-config'
    autoImplementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Crashlytics Gradle plugin is applied in the plugins block above (release
// mapping upload). The firebase-perf Gradle plugin stays OUT: perf-plugin:1.4.2
// is incompatible with AGP 8.x, and our custom code traces work through the
// firebase_performance Flutter plugin without it.
