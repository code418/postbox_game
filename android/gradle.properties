# Metaspace raised 512M->1024M: AGP 8.11's lintVitalAnalyze + R8 exhaust 512M and
# crash with OutOfMemoryError: Metaspace (surfaces as bogus "bug in lint" failures).
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M
android.enableJetifier=true
android.useAndroidX=true
# R8 optimised resource shrinking is automatic from AGP 9.0, which rejects the old
# `android.r8.optimizedShrinking` flag AGP 8.11 needed, so it's gone.
# (Removed android.enableR8=true — AGP has it Enforced since 7.0 and warns to delete
#  it; R8 code+resource shrinking is enabled by the Flutter Gradle plugin default,
#  asserted in app/build.gradle.)
# This builtInKotlin flag was added automatically by Flutter migrator.
# Held at false only because in_app_review 2.0.12 applies KGP unconditionally
# (checklist in app/build.gradle). To switch on, set it to `true`; don't delete
# the line, or Flutter's migrator writes `false` straight back.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
