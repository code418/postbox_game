# Metaspace raised 512M->1024M: AGP 8.11's lintVitalAnalyze + R8 exhaust 512M and
# crash with OutOfMemoryError: Metaspace (surfaces as bogus "bug in lint" failures).
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M
android.enableJetifier=true
android.useAndroidX=true
# R8 optimised resource shrinking. AGP 8.11 spells this `optimizedShrinking`; it is
# renamed `android.r8.optimizedResourceShrinking` in AGP 8.12+ and becomes automatic
# in AGP 9.0 — rename/drop this line when we move off 8.11. Prerequisites are already
# met: android.r8.integratedResourceShrinking and android.nonFinalResIds default true.
# (Removed android.enableR8=true — AGP has it Enforced since 7.0 and warns to delete
#  it; R8 code+resource shrinking is enabled by the Flutter Gradle plugin default,
#  asserted in app/build.gradle.)
android.r8.optimizedShrinking=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
