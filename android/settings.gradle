pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.2.1" apply false
    // NOT migrated to Flutter Built-in Kotlin: Flutter 3.44's built-in Kotlin pins
    // KGP 2.0.0, which cannot read the Kotlin 2.2.0 metadata in our play-services /
    // firebase deps (firebase_analytics fails compileReleaseKotlin). Keep an explicit
    // KGP >= 2.2.20 until the bundled built-in Kotlin version catches up. This leaves
    // the "app applies the Kotlin Gradle Plugin" deprecation warning in place by design.
    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
    id "com.google.gms.google-services" version "4.4.4" apply false
}

include ":app"
