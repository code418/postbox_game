pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.4.1" apply false
    // Chooses the Kotlin version for the whole build, and stays after the move to
    // AGP built-in Kotlin: AGP 9 compiles Kotlin with whichever KGP the classpath
    // declares (its own floor is 2.2.10), so this pin is what keeps us above the
    // 2.2.x metadata in the play-services / firebase deps. Built-in Kotlin itself is
    // still off (android.builtInKotlin=false) only because in_app_review applies
    // KGP unconditionally: see app/build.gradle for the switch-on checklist.
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
    id "com.google.gms.google-services" version "4.4.4" apply false
}

include ":app"
